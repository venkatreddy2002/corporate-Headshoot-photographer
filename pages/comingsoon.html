<!DOCTYPE html>
<html lang="en" class="dark overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Lumini Photography</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="icon" type="image/png" href="../assets/images/Group 179.svg">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f1f5f9;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .bg-coming-soon {
            background-image: linear-gradient(to bottom, rgba(3, 7, 18, 0.75), rgba(3, 7, 18, 0.85)), url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
    </style>
    <link rel="stylesheet" href="../assets/css/rtl.css">
</head>

<body class="min-h-screen w-full flex flex-col justify-center items-center relative overflow-x-hidden bg-coming-soon">

    <!-- Branding Header (Matching site layout) -->
    <header class="absolute top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-6 lg:px-20 py-8 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2 group">
                    <img src="../assets/images/Group 179.svg" alt="Logo"
                        class="w-8 h-8 object-cover group-hover:scale-105 transition-transform">
                    <h2
                        class="text-[17px] font-serif font-bold italic uppercase tracking-widest flex items-center  leading-none">
                        Lumini</h2>
                </a>
            </div>
            <!-- Empty space for nav if needed later -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="z-10 text-center px-4 max-w-4xl mx-auto w-full">
        <div
            class="mb-8 inline-block glass px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.4em] text-primary animate-pulse">
            New Vision Incoming
        </div>

        <h1 class="text-4xl md:text-6xl font-serif font-black italic mb-8 leading-[1.1] tracking-tighter">
            Something <span class="text-primary italic">Spectacular</span> <br> is Developing
        </h1>

        <p class="text-base md:text-lg text-slate-400 max-w-xl mx-auto mb-12 font-medium leading-relaxed opacity-80">
            We're currently processing our latest masterpieces. Our new portfolio and client portal will be live
            shortly. Stay tuned for a redefined lens on luxury photography.
        </p>

        <!-- Newsletter / Notification -->
        <div class="w-full max-w-md mx-auto glass p-2 rounded-2xl flex flex-col sm:flex-row gap-2 shadow-2xl">
            <input type="email" placeholder="Enter your email"
                class="flex-1 bg-transparent border-none focus:ring-0 px-6 py-4 text-sm font-medium placeholder:text-slate-500"
                required>
            <button
                class="bg-primary text-white px-8 py-4 rounded-xl font-bold uppercase tracking-widest text-xs hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 group">
                Notify Me
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="group-hover:translate-x-1 transition-transform">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>

        <div class="mt-16 flex justify-center gap-8 text-slate-500">
            <a href="#" class="hover:text-white transition-colors flex flex-col items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span class="text-[10px] font-black uppercase tracking-widest">Portfolio</span>
            </a>
            <div class="w-px h-12 bg-white/10"></div>
            <a href="#" class="hover:text-white transition-colors flex flex-col items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="text-[10px] font-black uppercase tracking-widest">Contact</span>
            </a>
            <div class="w-px h-12 bg-white/10"></div>
            <a href="index.html" class="hover:text-white transition-colors flex flex-col items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="text-[10px] font-black uppercase tracking-widest">Home</span>
            </a>
        </div>
    </main>

    <!-- Animated Elements -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/20 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] animate-pulse"></div>

    <footer
        class="absolute bottom-8 left-0 right-0 text-center text-slate-600 text-[10px] font-bold uppercase tracking-[0.2em]">
        &copy; 2026 Lumini. All rights reserved.
    </footer>

</body>

</html>
