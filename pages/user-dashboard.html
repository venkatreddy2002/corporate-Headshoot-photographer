    <script>
        // MOBILE DRAWER LOGIC
        const drawerTrigger = document.getElementById('mobile-drawer-trigger');
        const drawerClose = document.getElementById('mobile-drawer-close');
        const drawerOverlay = document.getElementById('drawer-overlay');
        const mobileDrawer = document.getElementById('mobile-drawer');

        function openDrawer() {
            mobileDrawer.classList.add("drawer-active");
            drawerOverlay.classList.remove('invisible', 'opacity-0');
        }

        function closeDrawer() {
            mobileDrawer.classList.remove("drawer-active");
            drawerOverlay.classList.add('invisible', 'opacity-0');
        }

        if (drawerTrigger) drawerTrigger.addEventListener('click', openDrawer);
        if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
        if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);

        // Update active state in drawer
        function updateDrawerActive(sectionId) {
            const links = mobileDrawer.querySelectorAll('nav a');
            links.forEach(link => {
                const onclick = link.getAttribute('onclick');
                const iconContainer = link.querySelector('span.size-9');
                
                if (onclick && onclick.includes(`'${sectionId}'`)) {
                    link.classList.add('bg-primary', 'text-white');
                    link.classList.remove('text-slate-900', 'dark:text-white/90', 'hover:text-primary');
                    if (iconContainer) {
                        iconContainer.classList.add('bg-white/20');
                        iconContainer.classList.remove('bg-slate-100', 'dark:bg-white/5');
                    }
                } else if (onclick) {
                    link.classList.remove('bg-primary', 'text-white');
                    link.classList.add('text-slate-900', 'dark:text-white/90', 'hover:text-primary');
                    if (iconContainer) {
                        iconContainer.classList.remove('bg-white/20');
                        iconContainer.classList.add('bg-slate-100', 'dark:bg-white/5');
                    }
                }
            });
        }

        // Wrap switchSection to update drawer
        const originalSwitchSection = window.switchSection;
        window.switchSection = function(sectionId) {
            if (originalSwitchSection) originalSwitchSection(sectionId);
            updateDrawerActive(sectionId);
        };
    </script>
